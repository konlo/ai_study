name: Build and deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: daily_ai_summary/requirements.txt
      - run: pip install -r daily_ai_summary/requirements.txt
      - run: python -m unittest discover -s daily_ai_summary/tests -v
      - uses: actions/jekyll-build-pages@v1
        with:
          source: daily_ai_summary/site
          destination: _site
      - name: Verify rendered pages
        run: |
          test -s _site/index.html
          test -n "$(find _site/content -name '*.html' -print -quit)"
          grep -q '/ai_study/content/' _site/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    if: vars.PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
